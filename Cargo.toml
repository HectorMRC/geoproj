[package]
name = "geoproj"
version = "0.1.0"
edition = "2024"

[dependencies]
boolygon = { version = "0.1.0", git = "https://github.com/hectormrc/boolygon.git", branch = "main", default-features = false, features = [
  "cartesian",
  "spherical",
] }
geocart = { version = "0.1.1", git = "https://github.com/hectormrc/geocart.git", branch = "main", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
serde = { version = "1.0.219", default-features = false, features = [
  "std",
  "derive",
], optional = true }
thiserror = { version = "2.0.12", default-features = false }

[features]
default = [
  "equirectangular",
  "gall-stereographic",
  "orthographic",
  "serde",
  "svg",
]
equirectangular = []
gall-stereographic = []
orthographic = []
serde = ["dep:serde", "geocart/serde"]
svg = []
